[package]
name = "instagram-downloader"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "JDownloader-style Instagram download manager: link grabber, persistent resumable queue, cookie authentication"
license = "MIT"
readme = "README.md"

[[bin]]
name = "igdl"
path = "src/main.rs"

[[bin]]
name = "igdl-gui"
path = "src/bin/igdl-gui.rs"
required-features = ["gui"]

[lib]
name = "igdl"
path = "src/lib.rs"

[features]
default = ["gui"]
# The desktop window (`igdl-gui`). Build without it: `cargo build --no-default-features`.
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd", "dep:opener"]

[dependencies]
arboard = { version = "3.7.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
# Colour decision for log lines on stderr (terminal, NO_COLOR/CLICOLOR, Windows VT mode); already used by indicatif.
console = { version = "0.16.6", default-features = false, features = ["std"] }
directories = "6.0.0"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11", "clipboard", "links"], optional = true }
# Only to enable egui's bundled emoji/icon fonts (eframe has no switch for them).
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"], optional = true }
egui_extras = { version = "0.37", optional = true }
filetime = "0.2.29"
futures = "0.3.34"
indicatif = "0.18.6"
opener = { version = "0.9", default-features = false, optional = true }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["stream", "json", "gzip"] }
rfd = { version = "0.17", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
# GetConsoleProcessList: notice that igdl.exe was double-clicked (its console closes on exit).
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3.27.0"
wiremock = "0.6.5"
