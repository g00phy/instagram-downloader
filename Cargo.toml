[package]
name = "instagram-downloader"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "JDownloader-style Instagram download manager: link grabber, persistent resumable queue, cookie authentication"
license = "MIT"
readme = "README.md"

[[bin]]
name = "igdl"
path = "src/main.rs"

[lib]
name = "igdl"
path = "src/lib.rs"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
directories = "6.0.0"
filetime = "0.2.29"
futures = "0.3.34"
indicatif = "0.18.6"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["stream", "json", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
